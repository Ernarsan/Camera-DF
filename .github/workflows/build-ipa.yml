name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 📱 Select Xcode Version
        run: |
          for xcode in /Applications/Xcode_16*.app /Applications/Xcode*.app; do
            if [ -d "$xcode" ]; then
              echo "Selecting $xcode"
              sudo xcode-select -s "$xcode/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          swift -version

      - name: 🛠️ Install XcodeGen
        run: |
          brew install xcodegen

      - name: ⚙️ Generate Xcode Project
        run: |
          cd AIComposeCamera
          xcodegen generate --spec project.yml
          ls -la

      - name: 🔧 Patch project.pbxproj for Unsigned Build
        run: |
          python3 -c "
          import os

          pbx_path = 'AIComposeCamera/AIComposeCamera.xcodeproj/project.pbxproj'
          if os.path.exists(pbx_path):
              with open(pbx_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              content = content.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
              content = content.replace('ProvisioningStyle = Automatic;', 'ProvisioningStyle = Manual;')
              content = content.replace('CODE_SIGNING_ALLOWED = YES;', 'CODE_SIGNING_ALLOWED = NO;')
              content = content.replace('buildSettings = {', 'buildSettings = {\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGN_IDENTITY = \"\";\n\t\t\t\tDEVELOPMENT_TEAM = \"\";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"\";')
              
              with open(pbx_path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('✅ project.pbxproj patched for unsigned build')
          else:
              print('⚠️ project.pbxproj not found at:', pbx_path)
          "

      - name: ⚙️ Build Archive via Xcode (Real iPhone ARM64)
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild archive \
            -project "AIComposeCamera/AIComposeCamera.xcodeproj" \
            -scheme "AIComposeCamera" \
            -archivePath "build/AIComposeCamera.xcarchive" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | tee xcode_build.log || {
              echo "### ❌ Xcode Build Error Log" >> $GITHUB_STEP_SUMMARY
              echo '```text' >> $GITHUB_STEP_SUMMARY
              tail -n 120 xcode_build.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            }

      - name: 📦 Package into AIComposeCamera.ipa
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/*.xcarchive/Products/Applications -name "*.app" -type d | head -n 1)
          echo "Found .app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app not found in archive!"
            exit 1
          fi
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r AIComposeCamera.ipa Payload
          cd ..
          echo "### 🎉 IPA Successfully Built" >> $GITHUB_STEP_SUMMARY
          ls -lh build/AIComposeCamera.ipa

      - name: 🚀 Upload AIComposeCamera.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIComposeCamera-ipa
          path: build/AIComposeCamera.ipa
          retention-days: 14

      - name: 🌟 Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "AIComposeCamera v1.0.${{ github.run_number }}"
          body: "Готовый к установке iOS IPA файл приложения AIComposeCamera, собранный через GitHub Actions без платного аккаунта Apple."
          files: build/AIComposeCamera.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-error-log
          path: xcode_build.log
